{{define "forum/new_topic"}}
{{template "header" .}}
<section class="forum-page module-page-plain container py-3" style="max-width:980px;">
    <div class="forum-topic-header mb-4">
        <div>
            <h1>Új fórum téma</h1>
            <div class="text-muted">Válassz kategóriát, adj címet és írd meg a nyitó hozzászólást.</div>
        </div>
    </div>
    {{if .ErrorMessage}}<div class="alert alert-danger">{{.ErrorMessage}}</div>{{end}}
    <form method="POST" action="/forum/new-topic" class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Kategória</label>
                <select name="category_id" class="form-select" required>
                    <option value="">Válassz kategóriát...</option>
                    {{range .ListableCategories}}
                    <option value="{{.ID.Hex}}" data-parent="{{.ParentName}}" {{if eq $.Form.CategoryID .ID.Hex}}selected{{end}}>
                        {{if .ParentName}}{{.Name}}{{else}}◆ {{.Name}}{{end}}
                    </option>
                    {{end}}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Cím</label>
                <input name="title" class="form-control" value="{{.Form.Title}}" maxlength="150" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nyitó hozzászólás</label>
                <div class="d-flex flex-wrap gap-1 mb-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="mdWrap('content','**','**')" title="Félkövér"><b>B</b></button>
                    <button type="button" class="btn btn-sm btn-outline-secondary fst-italic" onclick="mdWrap('content','*','*')" title="Dőlt">I</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary text-decoration-line-through" onclick="mdWrap('content','~~','~~')" title="Áthúzott">S</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="mdLine('content','## ')" title="Címsor">H2</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="mdLine('content','- ')" title="Lista">&#8226; Lista</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="mdWrap('content','`','`')" title="Kód"><code>code</code></button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="mdInsertLink('content')" title="Link">&#128279; Link</button>
                    <button type="button" class="btn btn-sm btn-outline-primary ms-auto" id="btn-preview-content" onclick="togglePreview('content','md-preview-content','btn-preview-content')">&#128065; Előnézet</button>
                </div>
                <div class="md-editor-wrap">
                    <textarea id="content" name="content" class="form-control font-monospace" rows="10" maxlength="12000" required oninput="livePreview('content','md-preview-content')">{{.Form.Content}}</textarea>
                    <div id="md-preview-content" class="md-preview d-none article-content border rounded p-3 bg-white"></div>
                </div>
                <div class="form-text">Markdown formátum: **félkövér**, *dőlt*, ## Cím, - lista, [szöveg](url)</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Tagek</label>
                <input name="tags" class="form-control" value="{{.Form.Tags}}" placeholder="pl. videokártya, driver, kérdés">
            </div>
            <div class="d-flex justify-content-between">
                <a href="/forum" class="btn btn-outline-secondary">Mégse</a>
                <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg me-1"></i>Téma létrehozása</button>
            </div>
        </div>
    </form>
</section>
<script>
(function() {
    var select = document.querySelector('select[name="category_id"]');
    if (!select) return;
    var options = Array.prototype.slice.call(select.querySelectorAll('option[data-parent]'));
    var groups = {};
    var groupOrder = [];
    options.forEach(function(opt) {
        var parent = opt.getAttribute('data-parent') || '';
        if (!groups[parent]) {
            groups[parent] = [];
            groupOrder.push(parent);
        }
        groups[parent].push(opt);
        opt.parentNode.removeChild(opt);
    });
    groupOrder.forEach(function(parent) {
        if (parent) {
            var optgroup = document.createElement('optgroup');
            optgroup.label = parent;
            groups[parent].forEach(function(opt) { optgroup.appendChild(opt); });
            select.appendChild(optgroup);
        } else {
            groups[parent].forEach(function(opt) { select.appendChild(opt); });
        }
    });
}());
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/js/md-editor.js"></script>
{{template "footer" .}}
{{end}}
