{{define "admin-gallery-form"}}{{template "admin-header" .}}
<div class="container" style="max-width:900px"><h1 class="h3 mb-4">{{.Title}}</h1>{{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}
<form method="post"><div class="mb-3"><label class="form-label">Cím</label><input required class="form-control" name="title" value="{{.Gallery.Title}}"></div>
<div class="mb-3"><label class="form-label">Képek sorrendben</label><div class="d-flex gap-2 mb-2"><button type="button" class="btn btn-sm btn-outline-primary" id="gallery-media-picker"><i class="bi bi-images"></i> Kép hozzáadása a médiatárból</button><a href="/admin/media" target="_blank" class="btn btn-sm btn-outline-secondary">Feltöltés a médiatárba</a></div><p class="form-text">A kiválasztás sorrendje a képsorrend. A mezőben átrendezhető vagy törölhető; csak képek menthetők.</p><textarea class="form-control" id="gallery-image-ids" rows="6" name="image_ids">{{range .Gallery.ImageIDs}}{{.}}
{{end}}</textarea></div>
<div class="d-flex gap-2"><button class="btn btn-primary">Mentés</button><a class="btn btn-outline-secondary" href="/admin/galleries">Mégse</a></div></form></div>
<script>(function(){var b=document.getElementById('gallery-media-picker'),out=document.getElementById('gallery-image-ids');if(!b||!out)return;b.addEventListener('click',function(){fetch('/admin/media/picker').then(function(r){return r.json()}).then(function(data){var all=(data.all||[]).filter(function(m){return /^image\//.test(m.mime_type||'')});var id=prompt('Kép kiválasztása:\n'+all.map(function(m){return m.id+' — '+(m.title||m.filename||'')}).join('\n'));if(!id)return;out.value+=(out.value.trim()?'\n':'')+id.trim();out.dispatchEvent(new Event('input',{bubbles:true}));});});}());</script>
{{template "admin-footer" .}}{{end}}
