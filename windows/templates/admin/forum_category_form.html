{{define "admin/forum_category_form"}}
{{template "admin-header" .}}
<div class="container" style="max-width:900px;">
    <h1 class="h3 mb-4">{{if .Category}}Fórum kategória szerkesztése{{else}}Fórum kategória létrehozása{{end}}</h1>
    {{if .ErrorMessage}}<div class="alert alert-danger">{{.ErrorMessage}}</div>{{end}}
    <form method="POST" class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Név</label>
                <input name="name" class="form-control" value="{{if .Category}}{{.Category.Name}}{{end}}" required maxlength="100">
            </div>
            <div class="mb-3">
                <label class="form-label">Szülő kategória</label>
                <select name="parent_id" class="form-select">
                    <option value="">Nincs</option>
                    {{range .Categories}}
                    <option value="{{.ID.Hex}}" {{if and $.Category (eq $.Category.ParentIDHex .ID.Hex)}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Leírás</label>
                <textarea name="description" class="form-control" rows="3">{{if .Category}}{{.Category.Description}}{{end}}</textarea>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Bootstrap ikon név</label>
                    <input name="icon" class="form-control" value="{{if .Category}}{{.Category.Icon}}{{end}}" placeholder="cpu">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Sorrend</label>
                    <input name="display_order" type="number" class="form-control" value="{{if .Category}}{{.Category.DisplayOrder}}{{else}}0{{end}}">
                </div>
            </div>
            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" name="active" id="active" {{if or (not .Category) .Category.Active}}checked{{end}}>
                <label class="form-check-label" for="active">Aktív</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="allow_topics" id="allow_topics" {{if or (not .Category) .Category.AllowTopics}}checked{{end}}>
                <label class="form-check-label" for="allow_topics">Közvetlenül fogadhat témákat</label>
            </div>
            <div class="d-flex justify-content-between mt-4">
                <a href="/admin/forum/categories" class="btn btn-outline-secondary">Mégse</a>
                <button class="btn btn-primary" type="submit">Mentés</button>
            </div>
        </div>
    </form>
</div>
{{template "admin-footer" .}}
{{end}}
