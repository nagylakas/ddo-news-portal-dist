{{define "forum/category"}}
{{template "header" .}}
<section class="forum-page container-fluid px-4 px-lg-5 py-5" style="margin-top:90px;">
    <div class="row g-4">
        {{template "forum/sidebar" .}}
        <main class="col-lg-9 col-xl-10">
            <div class="forum-hero mb-4">
                <div>
                    <h1>{{.Category.Name}}</h1>
                    <p>{{.Category.Description}}</p>
                </div>
                {{if .Category.AllowTopics}}
                <a href="/forum/new-topic?category={{.Category.ID.Hex}}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Új téma</a>
                {{end}}
            </div>
            {{template "forum/topic_list" .}}
        </main>
    </div>
</section>
{{template "footer" .}}
{{end}}
